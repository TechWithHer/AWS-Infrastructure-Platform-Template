AWSTemplateFormatVersion: '2010-09-09'
Description: Terraform Backend Resources for Strenure Internal Team 

Resources:

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: strenure-terraform-state-bucket

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  TerraformLockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: strenure-terraform-locktable

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S

      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
